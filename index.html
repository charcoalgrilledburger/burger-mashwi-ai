/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

  const value = String(text || "").trim();

  if(!value){
    return state.language;
  }

  /*
    Urdu-specific letters/words first.
    Arabic script alone does not automatically mean Arabic.
  */

  if(
    /[ٹڈڑںھگپچژے]/.test(value) ||
    /\b(میں|مجھے|چاہیے|ہے|ہیں|اور|کیا|بھیج|مینیو|اردو|آپ|آرڈر|قیمت|کتنے|کتنا)\b/.test(value)
  ){
    return "ur";
  }

  if(/[\u0600-\u06FF]/.test(value)){
    return "ar";
  }

  const q=value.toLowerCase();

  const romanUrduWords=[
    "mujhe",
    "mujhy",
    "mujhay",
    "chahiye",
    "chaahiye",
    "mujh",
    "mein",
    "mere",
    "aap",
    "ap",
    "hai",
    "hain",
    "kya",
    "kea",
    "kitna",
    "kitne",
    "aur",
    "bas",
    "bhej",
    "bejh",
    "dein",
    "do",
    "chahiy",
    "karna",
    "karo",
    "krna",
    "dikhao",
    "batao",
    "milega",
    "chahiye"
  ];

  for(const word of romanUrduWords){

    if(
      new RegExp("\\b"+word+"\\b","i").test(q)
    ){
      return "ur";
    }
  }

  return "en";
}

/* =========================================================
   NORMALIZATION + FUZZY SEARCH
========================================================= */

function normalize(value){

  return String(value || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ")
    .trim();

}


function levenshtein(a,b){

  a=normalize(a);
  b=normalize(b);

  const matrix=[];

  for(let i=0;i<=b.length;i++){
    matrix[i]=[i];
  }

  for(let j=0;j<=a.length;j++){
    matrix[0][j]=j;
  }

  for(let i=1;i<=b.length;i++){

    for(let j=1;j<=a.length;j++){

      matrix[i][j]=
        b.charAt(i-1)===a.charAt(j-1)
        ? matrix[i-1][j-1]
        : Math.min(
            matrix[i-1][j]+1,
            matrix[i][j-1]+1,
            matrix[i-1][j-1]+1
          );

    }
  }

  return matrix[b.length][a.length];
}

function itemScore(query,item){

  const q=normalize(query);

  const names=[
    normalize(item.name),
    normalize(item.arabic)
  ];

  let best=0;

  for(const name of names){

    if(!name) continue;

    if(
      q.includes(name) ||
      name.includes(q)
    ){
      best=Math.max(best,100);
    }

    const queryWords=q.split(" ");
    const nameWords=name.split(" ");

    let matched=0;

    for(const qw of queryWords){

      if(!qw || qw.length<2) continue;

      for(const nw of nameWords){

        if(
          nw.includes(qw) ||
          qw.includes(nw) ||
          levenshtein(qw,nw)<=2
        ){
          matched++;
        }

      }
    }

    const ratio=
      matched /
      Math.max(
        1,
        Math.min(queryWords.length,nameWords.length)
      );

    best=Math.max(best,ratio*80);

  }

  return best;
}


function findMenuItem(text){

  const value = normalize(text);

  /*
    IMPORTANT:
    Menu/question phrases must NOT be treated as food items.
  */

  if(
    /(^|\s)(send me menu|show me menu|show menu|menu|send menu|menu please|menu bhejo|menu dikhao|menu batao|menu chahiye|mujhe menu chahiye|اب بتاو|اب بتائیں|اب بتاؤ|مینو|قائمة)(\s|$)/i.test(value)
  ){
    return null;
  }


  /*
    Meal-specific aliases must be checked before
    general burger aliases.
  */

  if(
    /(double chicken|dubl chikn|double chikn|dubl chicken|double chicken burger|دبل دجاج)/i.test(value) &&
    /(meal|وجبة)/i.test(value)
  ){

    return getItemById(9);
  }


  if(
    /(zinger cheese burger|zinger burger|zinger)/i.test(value) &&
    /(meal|وجبة)/i.test(value)
  ){

    return getItemById(13);
  }


  /*
    Explicit aliases.
  */

  for(const alias of ALIASES){

    for(const word of alias.words){

      if(
        value.includes(
          normalize(word)
        )
      ){

        /*
          Do not let a normal burger alias
          override a meal request.
        */

        const aliasItem = getItemById(alias.id);

        if(
          aliasItem &&
          /(meal|وجبة)/i.test(value) &&
          /meal/i.test(aliasItem.name || "")
        ){

          return aliasItem;

        }

        if(
          aliasItem &&
          /(meal|وجبة)/i.test(value)
        ){

          continue;

        }

        return aliasItem;

      }

    }

  }


  /*
    Regular Fries requires size selection.
  */

  if(
    /(regular fries|fries|بطاطس عادية|بطاطس)/i.test(value) &&
    !/(small|large|صغير|صغيرة|كبير|كبيرة)/i.test(value)
  ){

    return {
      special:"regular-fries"
    };

  }


  /*
    Prevent Triple Beef standalone.
  */

  if(
    /(triple beef|تریپل بیف|تريبل لحم)/i.test(value) &&
    !/(meal|وجبة)/i.test(value)
  ){

    return {
      special:"invalid-triple-beef"
    };

  }


  /*
    Normal fuzzy matching.
  */

  const matches = MENU
    .map(item => ({
      item,
      score:itemScore(text,item)
    }))
    .filter(x => x.score >= 45)
    .sort((a,b) => b.score-a.score);


  return matches.length
    ? matches[0].item
    : null;

}


/* =========================================================
   QUANTITY
========================================================= */

function extractQuantity(text){

  const value=normalize(text);

  /*
    Only treat numbers as quantity when explicitly indicated.
  */

  const explicitPatterns=[

    /\b(\d+)\s*(x|times)\b/i,

    /\bx\s*(\d+)\b/i,

    /\b(\d+)\s*(pcs|pieces|piece)\b/i,

    /\bquantity\s*(\d+)\b/i,

    /\bqty\s*(\d+)\b/i,

    /(\d+)\s*(حبة|حبات|عدد)/i

  ];

  for(const pattern of explicitPatterns){

    const match=value.match(pattern);

    if(match){

      const number=
        Number(match[1] || match[2]);

      if(
        number>0 &&
        number<=50
      ){

        return number;

      }

    }

  }


  const words={
    one:1,
    two:2,
    three:3,
    four:4,
    five:5,
    six:6,
    seven:7,
    eight:8,
    nine:9,
    ten:10,

    "ایک":1,
    "دو":2,
    "تین":3,
    "چار":4,
    "پانچ":5
  };

  for(const word in words){

    if(
      new RegExp(
        "\\b"+word+"\\b",
        "i"
      ).test(value)
    ){

      return words[word];

    }

  }

  return 1;

}


/* =========================================================
   ORDER
========================================================= */

function addToOrder(item,quantity=1){

  const existing=
    state.currentOrder.find(
      x=>x.id===item.id
    );

  if(existing){

    existing.quantity+=quantity;

  }else{

    state.currentOrder.push({

      id:item.id,

      name:item.name,

      arabic:item.arabic,

      price:item.price,

      quantity:quantity

    });

  }

  state.orderState="ADDING_ITEMS";

}


function calculateTotal(order){

  return order.reduce(
    (sum,item)=>
      sum+(item.price*item.quantity),
    0
  );

}


function createSummary(order){

  let text=
    state.language==="ar"
    ? "📋 ملخص الطلب:\n"
    : "📋 Order summary:\n";

  for(const item of order){

    const name=
      state.language==="ar"
      ? item.arabic
      : item.name;

    text+=
      `• ${name} × ${item.quantity} = ${money(item.price*item.quantity)}\n`;

  }

  text+=
    `\n💰 ${
      state.language==="ar"
      ? "الإجمالي"
      : "Total"
    }: ${money(calculateTotal(order))}`;

  return text;

}


/* =========================================================
   FINISH ORDER
========================================================= */

function finishOrder(){

  if(!state.currentOrder.length){

    addMessage(t("noOrder"));

    return;

  }

  state.confirmedOrder=
    state.currentOrder.map(
      item=>({...item})
    );

  state.orderState=
    "WAITING_FOR_WHATSAPP_PERMISSION";

  addMessage(t("finish"));

  addMessage(
    createSummary(
      state.confirmedOrder
    )
  );

  addMessage(
    t("whatsappQuestion")
  );

}

   WHATSAPP

function createWhatsAppMessage(){

  const arabic=
    state.language==="ar";

  let message=
    arabic
    ? "مرحباً، أريد طلب:\n\n"
    : "Hello, I would like to order:\n\n";

  for(const item of state.confirmedOrder){

    const name=
      arabic
      ? item.arabic
      : item.name;

    message+=
      `${name} × ${item.quantity} = ${money(item.price*item.quantity)}\n`;

  }

  message+=
    `\n${
      arabic
      ? "الإجمالي"
      : "Total"
    }: ${money(
      calculateTotal(
        state.confirmedOrder
      )
    )}`;

  return message;

}

/* =========================================================
   SHOW MENU
========================================================= */

function showMenu(){

  const box=
    document.createElement("div");

  box.className="menu-box";

  const categories={};

  for(const item of MENU){

    if(!categories[item.category]){
      categories[item.category]=[];
    }

    categories[item.category].push(item);

  }

  for(
    const category of Object.keys(categories)
  ){

    const title=
      document.createElement("div");

    title.className="category";

    title.textContent=
      category;

    box.appendChild(title);

    for(
      const item of categories[category]
    ){

      const row=
        document.createElement("div");

      row.className="menu-row";

      const name=
        state.language==="ar"
        ? item.arabic
        : item.name;

      row.innerHTML=
        `<span>${name}</span>
         <b>${money(item.price)}</b>`;

      box.appendChild(row);

    }

  }

  chat.appendChild(box);

  chat.scrollTop=
    chat.scrollHeight;

}

/* =========================================================
   MAIN MESSAGE PROCESSOR
========================================================= */

function processMessage(text){

  const language =
    detectLanguage(text);

  state.language =
    language;

  const value =
    normalize(text);


  /* =====================================================
     CANCEL FIRST
  ===================================================== */

  if(isCancellation(text)){

    cancelOrder();

    return;

  }


  /* =====================================================
     MENU MUST BE CHECKED BEFORE ITEM MATCHING
  ===================================================== */

  if(asksMenu(text)){

    showMenu();

    return;

  }


  /* =====================================================
     "AB BATAO / AB BATAYEN"
  ===================================================== */

  if(
    /^(ab batao|ab bataye|ab bataiye|ab bataein|ab bataen|اب بتاؤ|اب بتاو|اب بتائیں|اب بتائیں)$/.test(value)
  ){

    if(state.language==="ar"){

      addMessage(
        "بالتأكيد، كيف يمكنني مساعدتكم؟ يمكنكم السؤال عن القائمة أو الأسعار أو الطلب."
      );

    }else if(state.language==="ur"){

      addMessage(
        "Ji zaroor. Aap menu, kisi item ki price ya apna order pooch sakte hain."
      );

    }else{

      addMessage(
        "Sure! You can ask me about the menu, prices, or your order."
      );

    }

    return;

  }


  /* =====================================================
     WHERE IS MY ORDER / CURRENT ORDER
  ===================================================== */

  if(
    /(where is my order|my order|order status|show my order|mera order|mera order kahan|order kahan|mera order batao|mera order dikhao|میرا آرڈر|میرا آرڈر کہاں|آرڈر کہاں ہے)/i.test(value)
  ){

    if(!state.currentOrder.length){

      if(state.language==="ar"){

        addMessage(
          "لا يوجد طلب حالي حتى الآن."
        );

      }else if(state.language==="ur"){

        addMessage(
          "Abhi koi current order maujood nahi hai."
        );

      }else{

        addMessage(
          "There is no current order yet."
        );

      }

      return;

    }


    let total = 0;

    const lines =
      state.currentOrder.map(orderItem => {

        const qty =
          Number(orderItem.quantity || 1);

        const price =
          Number(
            orderItem.item?.price ||
            orderItem.price ||
            0
          );

        const name =
          orderItem.item?.name ||
          orderItem.name ||
          "Item";

        const lineTotal =
          price * qty;

        total += lineTotal;

        return `${name} × ${qty} = ${money(lineTotal)}`;

      });


    if(state.language==="ar"){

      addMessage(
        "🧾 طلبكم الحالي:\n\n" +
        lines.join("\n") +
        `\n\n💰 الإجمالي: ${money(total)}`
      );

    }else if(state.language==="ur"){

      addMessage(
        "🧾 Aap ka current order:\n\n" +
        lines.join("\n") +
        `\n\n💰 Total: ${money(total)}`
      );

    }else{

      addMessage(
        "🧾 Your current order:\n\n" +
        lines.join("\n") +
        `\n\n💰 Total: ${money(total)}`
      );

    }

    return;

  }


  /* =====================================================
     HOW MUCH TOTAL
  ===================================================== */

  if(
    /(how much total|total|total kitna|kitna total|total kya hai|grand total|total price|my total|mera total|kul kitna|kul total|مجموع|الإجمالي|كم المجموع)/i.test(value)
  ){

    if(!state.currentOrder.length){

      if(state.language==="ar"){

        addMessage(
          "لا يوجد طلب حالياً لحساب الإجمالي."
        );

      }else if(state.language==="ur"){

        addMessage(
          "Abhi koi order nahi hai jis ka total nikala ja sake."
        );

      }else{

        addMessage(
          "There is no current order to calculate a total for."
        );

      }

      return;

    }


    const total =
      state.currentOrder.reduce(
        (sum, orderItem) => {

          const qty =
            Number(orderItem.quantity || 1);

          const price =
            Number(
              orderItem.item?.price ||
              orderItem.price ||
              0
            );

          return sum + (price * qty);

        },
        0
      );


    if(state.language==="ar"){

      addMessage(
        `💰 الإجمالي الحالي لطلبكم هو ${money(total)}`
      );

    }else if(state.language==="ur"){

      addMessage(
        `💰 Aap ke current order ka total ${money(total)} hai.`
      );

    }else{

      addMessage(
        `💰 Your current order total is ${money(total)}.`
      );

    }

    return;

  }


  /* =====================================================
     WHATSAPP PERMISSION
  ===================================================== */

  if(
    state.orderState ===
    "WAITING_FOR_WHATSAPP_PERMISSION"
    &&
    isWhatsAppPermission(text)
  ){

    showWhatsAppOrderButton();

    addMessage(
      t("whatsappReady")
    );

    return;

  }


  /* =====================================================
     FINISH / OK
     If an order exists, "ok" should NOT be a greeting.
  ===================================================== */

  if(
    state.currentOrder.length &&
    /^(ok|okay|acha|theek|theek hai|ٹھیک|ٹھیک ہے|اوکے|جی|جی ہاں|haan|han|yes|yes please)$/i.test(value)
  ){

    finishOrder();

    return;

  }


  /* =====================================================
     FINISH ORDER
  ===================================================== */

  if(isFinishPhrase(text)){

    finishOrder();

    return;

  }


  /* =====================================================
     LOCATION
  ===================================================== */

  if(asksLocation(text)){

    addMessage(
      t("location")
    );

    addAction(
      "📍 Open Location in Google Maps",
      openMaps
    );

    return;

  }


  /* =====================================================
     HOURS
  ===================================================== */

  if(asksHours(text)){

    addMessage(
      t("hours")
    );

    return;

  }


  /* =====================================================
     WHATSAPP
  ===================================================== */

  if(
    asksWhatsApp(text) &&
    state.orderState !==
    "WAITING_FOR_WHATSAPP_PERMISSION"
  ){

    addMessage(
      t("contact")
    );

    addAction(
      "📲 Chat with us on WhatsApp",
      openWhatsApp,
      "whatsapp-btn"
    );

    return;

  }


  /* =====================================================
     PRICE QUESTIONS
     MUST COME BEFORE ITEM MATCHING
  ===================================================== */

  if(
    /(price|price kya|kitne|kitna|cost|how much|qeemat|قیمت|كم|السعر)/i.test(value)
  ){

    const possible =
      findMenuItem(text);

    if(
      possible &&
      !possible.special
    ){

      if(state.language==="ar"){

        addMessage(
          `${possible.arabic}: ${money(possible.price)}`
        );

      }else{

        addMessage(
          `${possible.name}: ${money(possible.price)}`
        );

      }

      return;

    }

  }


  /* =====================================================
     ITEM MATCHING
     ONLY NOW
  ===================================================== */

  const item =
    findMenuItem(text);


  if(
    item &&
    item.special ===
    "regular-fries"
  ){

    if(state.language==="ar"){

      addMessage(
        "البطاطس العادية: الصغيرة 4 ريال والكبيرة 7 ريال. أي حجم تفضلون؟"
      );

    }else if(state.language==="ur"){

      addMessage(
        "Regular Fries: Small 4 SAR aur Large 7 SAR. Aap ko kaunsa size chahiye?"
      );

    }else{

      addMessage(
        "Regular Fries: Small 4 SAR or Large 7 SAR. Which size would you like?"
      );

    }

    return;

  }


  if(
    item &&
    item.special ===
    "invalid-triple-beef"
  ){

    if(state.language==="ar"){

      addMessage(
        "Triple Beef Cheese Burger متوفر كوجبة فقط بسعر 24 ريال."
      );

    }else if(state.language==="ur"){

      addMessage(
        "Triple Beef Cheese Burger standalone nahi hai. Sirf Triple Beef Cheese Burger Meal 24 SAR mein available hai."
      );

    }else{

      addMessage(
        "Triple Beef Cheese Burger is available as a meal only for 24 SAR."
      );

    }

    return;

  }


  if(item){

    /*
      New item modifies previous confirmed order.
    */

    if(state.confirmedOrder.length){

      state.confirmedOrder=[];

      document
        .querySelectorAll(".order-whatsapp-action")
        .forEach(x => x.remove());

    }


    /*
      Size-specific regular fries.
    */

    let selectedItem =
      item;

    const normalized =
      normalize(text);


    if(
      item.id ===
      "small-regular-fries"
      ||
      /small|small fries|صغير|صغيرة/i.test(normalized)
    ){

      selectedItem =
        getItemById(
          "small-regular-fries"
        );

    }


    if(
      item.id ===
      "large-regular-fries"
      ||
      /large|large fries|كبير|كبيرة/i.test(normalized)
    ){

      selectedItem =
        getItemById(
          "large-regular-fries"
        );

    }


    const quantity =
      extractQuantity(text);


    addToOrder(
      selectedItem,
      quantity
    );


    addMessage(
      itemAddedMessage(
        selectedItem,
        quantity
      )
    );

    return;

  }


  /* =====================================================
     GREETINGS
  ===================================================== */

  if(
    /^(hi|hello|hey|salam|assalam|thanks|thank you|shukriya|شکریہ|السلام علیکم|سلام)$/i.test(value)
  ){

    if(state.language==="ar"){

      addMessage(
        "مرحباً بكم! كيف يمكنني مساعدتكم؟"
      );

    }else if(state.language==="ur"){

      addMessage(
        "Ji zaroor. Aap menu, prices ya order ke bare mein pooch sakte hain."
      );

    }else{

      addMessage(
        "Sure! You can ask me about the menu, prices, or place an order."
      );

    }

    return;

  }


  /* =====================================================
     DEFAULT
  ===================================================== */

  addMessage(
    t("unknown")
  );

  }

/* =========================================================
   VOICE
========================================================= */

voiceButton.onclick=
function(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    addMessage(
      "Voice input is not supported by this browser."
    );

    return;

  }

  const recognition=
    new SpeechRecognition();

  /*
    Arabic is used as the initial recognition language,
    but the recognized text goes through automatic
    language detection afterwards.
  */

  recognition.lang="ar-SA";

  recognition.continuous=false;

  recognition.interimResults=false;

  voiceButton.textContent=
    "🎙️ Listening...";

  recognition.onresult=
    function(event){

      const spoken=
        event.results[0][0].transcript;

      input.value=
        spoken;

      sendMessage();

    };

  recognition.onerror=
    function(){

      addMessage(
        "Voice input could not be started."
      );

    };

  recognition.onend=
    function(){

      voiceButton.textContent=
        "🎤";

    };

  try{

    recognition.start();

  }catch(error){

    voiceButton.textContent=
      "🎤";

  }

};


/* =========================================================
   OPTIONAL GOOGLE SHEET SYNC
========================================================= */

async function syncGoogleSheet(){

  status.textContent=
    "Syncing menu...";

  try{

    const url=
      "https://docs.google.com/spreadsheets/d/"+
      RESTAURANT.sheetId+
      "/gviz/tq?tqx=out:json";

    const response=
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Sheet unavailable"
      );

    }

    const raw=
      await response.text();

    const start=
      raw.indexOf("{");

    const end=
      raw.lastIndexOf("}");

    if(start<0 || end<0){

      throw new Error(
        "Invalid sheet response"
      );

    }

    const data=
      JSON.parse(
        raw.substring(
          start,
          end+1
        )
      );

    const rows=
      data.table?.rows || [];

    const fresh=[];

    for(const row of rows){

      const cells=
        (row.c || [])
        .map(
          cell=>cell?.v ?? ""
        );

      const name=
        String(
          cells[0] || ""
        ).trim();

      const category=
        String(
          cells[1] || ""
        ).trim();

      const price=
        Number(
          cells[2]
        );

      if(
        !name ||
        !Number.isFinite(price)
      ){

        continue;

      }

      fresh.push({

        id:
          normalize(name)
          .replace(/\s+/g,"-")
          .replace(
            /[^a-z0-9\-]/g,
            ""
          ),

        name:name,

        arabic:name,

        category:
          category ||
          "MENU",

        price:price

      });

    }

    if(!fresh.length){

      throw new Error(
        "No menu rows"
      );

    }

    MENU=
      fresh;

    status.textContent=
      "Menu synced from Google Sheet.";

  }catch(error){

    status.textContent=
      "Google Sheet is not publicly available yet. Built-in menu is active.";

  }

}
