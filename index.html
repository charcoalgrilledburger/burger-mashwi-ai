/* =========================================================
   LANGUAGE
========================================================= */

function detectLanguage(text){

  const value=String(text||"").trim();

  if(
    /[ٹڈڑںھگپچژے]/.test(value) ||
    /\b(میں|مجھے|چاہیے|ہے|ہیں|اور|کیا|بھیج|مینیو|اردو|آپ|آرڈر|قیمت|کتنے|کتنا)\b/.test(value)
  ){

    return "ur";

  }

  if(/[\u0600-\u06FF]/.test(value)){

    return "ar";

  }

  const q=value.toLowerCase();

  const romanWords=[

    "mujhe",
    "mujhy",
    "mujhay",
    "chahiye",
    "chahiy",
    "mein",
    "mere",
    "aap",
    "ap",
    "hai",
    "hain",
    "kya",
    "kea",
    "kitna",
    "kitne",
    "kitny",
    "aur",
    "bas",
    "bhej",
    "bejh",
    "dein",
    "dikhao",
    "batao",
    "milega",
    "karna",
    "karo",
    "krna",
    "order",
    "chikan",
    "chicken",
    "chikn",
    "chukn"

  ];

  for(const word of romanWords){

    if(
      new RegExp(
        "\\b"+word+"\\b",
        "i"
      ).test(q)
    ){

      return "ur";

    }

  }

  return "en";

}

function addMessage(
  text,
  sender="bot"
){

  const wrapper=
    document.createElement("div");

  wrapper.className=
    "message "+sender;

  const bubble=
    document.createElement("div");

  bubble.className=
    "bubble";

  bubble.textContent=
    text;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


function addAction(
  label,
  action,
  className="chat-action"
){

  const area=
    document.createElement("div");

  area.className=
    "action-area";

  const button=
    document.createElement("button");

  button.className=
    className;

  button.textContent=
    label;

  button.onclick=
    action;

  area.appendChild(button);

  chat.appendChild(area);

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

  return String(value||"")

    .toLowerCase()

    .replace(/[^\p{L}\p{N}\s]/gu," ")

    .replace(/\s+/g," ")

    .trim();

}


/* =========================================================
   ITEM HELPERS
========================================================= */

function getItemById(id){

  return MENU.find(
    item=>item.id===id
  ) || null;

}


function cleanQuantityText(text){

  return normalize(text)

    .replace(
      /\b\d+\s*(x|times|pcs|pieces|piece|quantity|qty)\b/gi,
      " "
    )

    .replace(
      /\bx\s*\d+\b/gi,
      " "
    )

    .replace(
      /\b\d+\s*(حبة|حبات|عدد)\b/gi,
      " "
    )

    .replace(
      /\b(one|two|three|four|five|six|seven|eight|nine|ten)\b/gi,
      " "
    )

    .replace(
      /\b(ایک|دو|تین|چار|پانچ)\b/gi,
      " "
    )

    .replace(
      /\b\d+\b/g,
      " "
    )

    .replace(/\s+/g," ")

    .trim();

}

/* =========================================================
   QUANTITY
========================================================= */

function extractQuantity(text){

  const value=
    normalize(text);

  /* 2x / 2 times */

  let match=
    value.match(
      /\b(\d+)\s*(x|times)\b/i
    );

  if(match){

    return limitQuantity(
      Number(match[1])
    );

  }


  /* x2 */

  match=
    value.match(
      /\bx\s*(\d+)\b/i
    );

  if(match){

    return limitQuantity(
      Number(match[1])
    );

  }


  /* pcs */

  match=
    value.match(
      /\b(\d+)\s*(pcs|pieces|piece)\b/i
    );

  if(match){

    return limitQuantity(
      Number(match[1])
    );

  }


  /* quantity */

  match=
    value.match(
      /\b(quantity|qty)\s*(\d+)\b/i
    );

  if(match){

    return limitQuantity(
      Number(match[2])
    );

  }


  /* Arabic quantity */

  match=
    value.match(
      /(\d+)\s*(حبة|حبات|عدد)/i
    );

  if(match){

    return limitQuantity(
      Number(match[1])
    );

  }


  /* Bare number at the end:
     chicken burger 2
     zinger roll 3
  */

  match=
    value.match(
      /(?:^|\s)(\d+)\s*$/
    );

  if(match){

    return limitQuantity(
      Number(match[1])
    );

  }


  /* English number words */

  const englishWords={

    one:1,
    two:2,
    three:3,
    four:4,
    five:5,
    six:6,
    seven:7,
    eight:8,
    nine:9,
    ten:10

  };

  for(
    const word in englishWords
  ){

    if(
      new RegExp(
        "\\b"+word+"\\b",
        "i"
      ).test(value)
    ){

      return englishWords[word];

    }

  }


  /* Urdu number words */

  const urduWords={

    "ایک":1,
    "دو":2,
    "تین":3,
    "چار":4,
    "پانچ":5,
    "چھ":6,
    "سات":7,
    "آٹھ":8,
    "نو":9,
    "دس":10

  };

  for(
    const word in urduWords
  ){

    if(value.includes(word)){

      return urduWords[word];

    }

  }


  return 1;

}


function limitQuantity(number){

  if(
    !Number.isFinite(number) ||
    number<1
  ){

    return 1;

  }

  return Math.min(
    50,
    Math.floor(number)
  );

}


/* =========================================================
   FIND ITEM
========================================================= */

function findMenuItem(text){

  const original=
    normalize(text);

  const value=
    cleanQuantityText(text);

  if(!value){

    return null;

  }


  /* Never treat menu questions as items */

  if(
    /(^|\s)(menu|list|items|قائمة|مینیو|منيو)(\s|$)/i.test(value)
  ){

    return null;

  }


  /* =====================================================
     EXACT MENU NAME
  ===================================================== */

  const exact=
    MENU.find(
      item=>
        normalize(item.name)===value ||
        normalize(item.arabic)===value
    );

  if(exact){

    return exact;

  }


  /* =====================================================
     EXACT ALIASES
  ===================================================== */

  const aliasMatches=[];

  for(
    const id in ITEM_ALIASES
  ){

    const aliases=
      ITEM_ALIASES[id];

    for(
      const alias of aliases
    ){

      if(
        normalize(alias)===value
      ){

        const item=
          getItemById(id);

        if(item){

          aliasMatches.push(item);

        }

      }

    }

  }

  if(aliasMatches.length===1){

    return aliasMatches[0];

  }


  /* =====================================================
     PHRASE CONTAINS ALIAS
     LONGEST MATCH WINS
  ===================================================== */

  let best=null;

  let bestLength=0;

  for(
    const id in ITEM_ALIASES
  ){

    const aliases=
      ITEM_ALIASES[id];

    for(
      const alias of aliases
    ){

      const a=
        normalize(alias);

      if(
        a.length>2 &&
        (
          value===a ||
          value.includes(" "+a) ||
          value.includes(a+" ")
        )
      ){

        const item=
          getItemById(id);

        if(
          item &&
          a.length>bestLength
        ){

          best=item;

          bestLength=a.length;

        }

      }

    }

  }

  if(best){

    return best;

  }


  /* =====================================================
     SIZE-SPECIFIC FRIES
  ===================================================== */

  if(
    /\bsmall regular fries\b/i.test(value) ||
    /\bsmall fries\b/i.test(value)
  ){

    return getItemById(
      "small-regular-fries"
    );

  }


  if(
    /\blarge regular fries\b/i.test(value) ||
    /\blarge fries\b/i.test(value)
  ){

    return getItemById(
      "large-regular-fries"
    );

  }


  /* =====================================================
     REGULAR FRIES WITHOUT SIZE
  ===================================================== */

  if(
    /\bregular fries\b/i.test(value)
  ){

    return {
      special:"regular-fries"
    };

  }


  /* =====================================================
     TRIPLE BEEF ONLY AS MEAL
  ===================================================== */

  if(
    /\btriple beef\b/i.test(value) &&
    !/\bmeal\b/i.test(value)
  ){

    return {
      special:"invalid-triple-beef"
    };

  }


  /* =====================================================
     ARABIC EXACT NAME SEARCH
  ===================================================== */

  const arabicExact=
    MENU.find(
      item=>
        normalize(item.arabic)===value
    );

  if(arabicExact){

    return arabicExact;

  }


  /* =====================================================
     IMPORTANT:
     NO BROAD FUZZY MATCHING.
     Unclear words must NOT create random orders.
  ===================================================== */

  return null;

}


/* =========================================================
   ORDER
========================================================= */

function addToOrder(
  item,
  quantity=1
){

  if(!item){

    return;

  }

  const existing=
    state.currentOrder.find(
      x=>x.id===item.id
    );

  if(existing){

    existing.quantity+=quantity;

  }else{

    state.currentOrder.push({

      id:item.id,

      name:item.name,

      arabic:item.arabic,

      price:item.price,

      quantity:quantity

    });

  }

  state.orderState=
    "ADDING_ITEMS";

}


function calculateTotal(order){

  return order.reduce(
    (sum,item)=>
      sum+
      (
        Number(item.price)*
        Number(item.quantity)
      ),
    0
  );

}


function createSummary(order){

  let text=
    state.language==="ar"
    ? "📋 ملخص الطلب:\n"
    : state.language==="ur"
    ? "📋 Aap ke order ka summary:\n"
    : "📋 Order summary:\n";

  for(
    const item of order
  ){

    const name=
      state.language==="ar"
      ? item.arabic
      : item.name;

    text+=
      `• ${name} × ${item.quantity} = ${money(item.price*item.quantity)}\n`;

  }

  text+=
    `\n💰 ${
      state.language==="ar"
      ? "الإجمالي"
      : "Total"
    }: ${money(
      calculateTotal(order)
    )}`;

  return text;

}

/* =========================================================
   MAIN PROCESSOR
========================================================= */

function processMessage(text){

  state.language=
    detectLanguage(text);

  const value=
    normalize(text);


  /* 1. CANCEL */

  if(
    isCancellation(text)
  ){

    cancelOrder();

    return;

  }


  /* 2. MENU */

  if(
    asksMenu(text)
  ){

    showMenu();

    return;

  }


  /* 3. AB BATAO */

  if(
    isAbBatao(text)
  ){

    if(
      state.language==="ur"
    ){

      addMessage(
        "Ji zaroor. Aap menu, kisi item ki price ya apna order pooch sakte hain."
      );

    }else if(
      state.language==="ar"
    ){

      addMessage(
        "بالتأكيد، كيف يمكنني مساعدتكم؟"
      );

    }else{

      addMessage(
        "Sure! You can ask me about the menu, prices, or your order."
      );

    }

    return;

  }


  /* 4. TOTAL — BEFORE PRICE AND ITEM */

  if(
    asksTotal(text)
  ){

    answerTotal();

    return;

  }


  /* 5. CURRENT ORDER */

  if(
    asksCurrentOrder(text)
  ){

    showCurrentOrder();

    return;

  }


  /* 6. WHATSAPP PERMISSION */

  if(
    state.orderState===
      "WAITING_FOR_WHATSAPP_PERMISSION" &&
    isWhatsAppPermission(text)
  ){

    showWhatsAppOrderButton();

    addMessage(
      t("whatsappReady")
    );

    return;

  }


  /* 7. OK WITH EXISTING ORDER */

  if(
    state.currentOrder.length &&
    /^(ok|okay|acha|theek|theek hai|ٹھیک|ٹھیک ہے|اوکے|جی|جی ہاں|haan|han|yes|yes please)$/i.test(value)
  ){

    finishOrder();

    return;

  }


  /* 8. NO / NOTHING ELSE */

  if(
    state.currentOrder.length &&
    isNoMore(text)
  ){

    addMessage(
      t("noMore")
    );

    finishOrder();

    return;

  }


  /* 9. FINISH */

  if(
    isFinishPhrase(text)
  ){

    finishOrder();

    return;

  }


  /* 10. LOCATION */

  if(
    asksLocation(text)
  ){

    addMessage(
      t("location")
    );

    addAction(
      "📍 Open Location in Google Maps",
      openMaps
    );

    return;

  }


  /* 11. HOURS */

  if(
    asksHours(text)
  ){

    addMessage(
      t("hours")
    );

    return;

  }


  /* 12. WHATSAPP CONTACT */

  if(
    asksWhatsApp(text) &&
    state.orderState!==
      "WAITING_FOR_WHATSAPP_PERMISSION"
  ){

    addMessage(
      t("contact")
    );

    addAction(
      "📲 Chat with us on WhatsApp",
      openWhatsApp,
      "whatsapp-btn"
    );

    return;

  }


  /* 13. PRICE QUESTION */

  if(
    asksPrice(text)
  ){

    const priceItem=
      findMenuItem(text);

    if(
      priceItem &&
      !priceItem.special
    ){

      const name=
        state.language==="ar"
        ? priceItem.arabic
        : priceItem.name;

      addMessage(
        `${name}: ${money(priceItem.price)}`
      );

      return;

    }

    /*
      If it is only a price question but
      item is unclear, DO NOT add anything.
    */

    addMessage(
      state.language==="ur"
      ? "Kis item ki price pooch rahe hain? Item ka naam bata dein."
      : state.language==="ar"
      ? "ما هو اسم الصنف الذي تريدون معرفة سعره؟"
      : "Which item's price would you like to know?"
    );

    return;

  }


  /* 14. ITEM */

  const item=
    findMenuItem(text);


  if(
    item &&
    item.special===
      "regular-fries"
  ){

    if(
      state.language==="ur"
    ){

      addMessage(
        "Regular Fries: Small 4 SAR aur Large 7 SAR. Aap ko kaunsa size chahiye?"
      );

    }else if(
      state.language==="ar"
    ){

      addMessage(
        "البطاطس العادية: الصغيرة 4 ريال والكبيرة 7 ريال. أي حجم تفضلون؟"
      );

    }else{

      addMessage(
        "Regular Fries: Small 4 SAR or Large 7 SAR. Which size would you like?"
      );

    }

    return;

  }


  if(
    item &&
    item.special===
      "invalid-triple-beef"
  ){

    if(
      state.language==="ur"
    ){

      addMessage(
        "Triple Beef Cheese Burger standalone nahi hai. Sirf Triple Beef Cheese Burger Meal 24 SAR mein available hai."
      );

    }else if(
      state.language==="ar"
    ){

      addMessage(
        "Triple Beef Cheese Burger متوفر كوجبة فقط بسعر 24 ريال."
      );

    }else{

      addMessage(
        "Triple Beef Cheese Burger is available as a meal only for 24 SAR."
      );

    }

    return;

  }


  if(item){

    /*
      If a new item is added after
      a confirmed order, remove confirmation.
    */

    if(
      state.confirmedOrder.length
    ){

      state.confirmedOrder=[];

      document
        .querySelectorAll(
          ".order-whatsapp-action"
        )
        .forEach(
          x=>x.remove()
        );

    }


    const quantity=
      extractQuantity(text);

    addToOrder(
      item,
      quantity
    );

    addMessage(
      itemAddedMessage(
        item,
        quantity
      )
    );

    return;

  }


  /* 15. GREETINGS */

  if(
    /^(hi|hello|hey|salam|assalam|thanks|thank you|shukriya|شکریہ|السلام علیکم|سلام)$/i.test(value)
  ){

    if(
      state.language==="ur"
    ){

      addMessage(
        "Ji zaroor. Aap menu, prices ya order ke bare mein pooch sakte hain."
      );

    }else if(
      state.language==="ar"
    ){

      addMessage(
        "مرحباً بكم! كيف يمكنني مساعدتكم؟"
      );

    }else{

      addMessage(
        "Sure! You can ask me about the menu, prices, or place an order."
      );

    }

    return;

  }


  /* 16. UNKNOWN */

  addMessage(
    t("unknown")
  );

}


/* =========================================================
   SEND
========================================================= */

function sendMessage(){

  const text=
    input.value.trim();

  if(!text){

    return;

  }

  addMessage(
    text,
    "user"
  );

  input.value="";

  processMessage(
    text
  );

}


sendButton.onclick=
  sendMessage;


input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key==="Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

   MAPS
========================================================= */

function openMaps(){

  window.open(
    RESTAURANT.maps,
    "_blank"
  );

}


/* =========================================================
   WHATSAPP
========================================================= */

function openWhatsApp(){

  window.open(
    "https://wa.me/"+
    RESTAURANT.whatsapp,
    "_blank"
  );

}


/* =========================================================
   VOICE
========================================================= */

voiceButton.onclick=
function(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    addMessage(
      "Voice input is not supported by this browser."
    );

    return;

  }

  const recognition=
    new SpeechRecognition();

  recognition.lang=
    "ar-SA";

  recognition.continuous=
    false;

  recognition.interimResults=
    false;

  voiceButton.textContent=
    "🎙️ Listening...";

  recognition.onresult=
    function(event){

      const spoken=
        event.results[0][0].transcript;

      input.value=
        spoken;

      sendMessage();

    };

  recognition.onerror=
    function(){

      addMessage(
        "Voice input could not be started."
      );

    };

  recognition.onend=
    function(){

      voiceButton.textContent=
        "🎤";

    };

  try{

    recognition.start();

  }catch(error){

    voiceButton.textContent=
      "🎤";

  }

};


/* =========================================================
   GOOGLE SHEET SYNC
========================================================= */

async function syncGoogleSheet(){

  status.textContent=
    "Syncing menu...";

  try{

    const url=
      "https://docs.google.com/spreadsheets/d/"+
      RESTAURANT.sheetId+
      "/gviz/tq?tqx=out:json";

    const response=
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Sheet unavailable"
      );

    }

    const raw=
      await response.text();

    const start=
      raw.indexOf("{");

    const end=
      raw.lastIndexOf("}");

    if(
      start<0 ||
      end<0
    ){

      throw new Error(
        "Invalid sheet response"
      );

    }

    const data=
      JSON.parse(
        raw.substring(
          start,
          end+1
        )
      );

    const rows=
      data.table?.rows || [];

    const fresh=[];

    for(
      const row of rows
    ){

      const cells=
        (row.c||[])
        .map(
          cell=>cell?.v ?? ""
        );

      const name=
        String(
          cells[0] || ""
        ).trim();

      const category=
        String(
          cells[1] || ""
        ).trim();

      const price=
        Number(
          cells[2]
        );

      if(
        !name ||
        !Number.isFinite(price)
      ){

        continue;

      }

      fresh.push({

        id:
          normalize(name)
          .replace(
            /\s+/g,
            "-"
          )
          .replace(
            /[^a-z0-9\-]/g,
            ""
          ),

        name:name,

        arabic:name,

        category:
          category ||
          "MENU",

        price:price

      });

    }

    if(
      !fresh.length
    ){

      throw new Error(
        "No menu rows"
      );

    }

    MENU=
      fresh;

    status.textContent=
      "Menu synced from Google Sheet.";

  }catch(error){

    status.textContent=
      "Google Sheet is not publicly available yet. Built-in menu is active.";

  }

}
