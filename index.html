<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Charcoal-grilled burger AI assistant, menu and ordering">

  <title>Charcoal-grilled burger | برغر مشوي على الفحم</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="site-header">
    <div class="brand">
      <h1>Charcoal-grilled burger 🍔🔥</h1>
      <p>برغر مشوي على الفحم</p>
    </div>
  </header>

  <section class="restaurant-info">
    <div>🕐 12:10 PM – 4:50 AM</div>
    <div>📍 Al Arijha Al Wusta – Aisha bint Abi Bakr St, Riyadh</div>
  </section>

  <section class="quick-actions">
    <button
      type="button"
      class="action-button map-button"
      onclick="openMaps()"
    >
      📍 Open Location
    </button>

    <button
      type="button"
      class="action-button whatsapp-button"
      onclick="openWhatsAppContact()"
    >
      📲 WhatsApp
    </button>

    <button
      type="button"
      class="action-button menu-button"
      onclick="showMenu()"
    >
      🍔 Menu
    </button>
  </section>

  <main id="chat" class="chat"></main>

  <section class="composer">
    <div class="composer-inner">

      <input
        id="messageInput"
        type="text"
        autocomplete="off"
        placeholder="Ask about our menu or place an order..."
        aria-label="Message"
      >

      <button
        id="voiceButton"
        type="button"
        onclick="startVoice()"
        title="Voice"
        aria-label="Voice"
      >
        🎤
      </button>

      <button
        id="sendButton"
        type="button"
        onclick="sendMessage()"
        title="Send"
        aria-label="Send"
      >
        ➤
      </button>

    </div>
  </section>

  <script src="./data.js"></script>
  <script src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
