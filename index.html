/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

  const value=String(text || "").trim();

  if(!value){
    return state.language;
  }

  if(
    /[ٹڈڑںھگپچژے]/.test(value) ||
    /\b(میں|مجھے|چاہیے|ہے|ہیں|اور|کیا|بھیج|مینیو|اردو|آپ|آرڈر|قیمت|کتنے|کتنا)\b/.test(value)
  ){
    return "ur";
  }

  if(/[\u0600-\u06FF]/.test(value)){
    return "ar";
  }

  const q=value.toLowerCase();

  const romanUrduWords=[
    "mujhe",
    "mujhy",
    "mujhay",
    "chahiye",
    "chaahiye",
    "mujh",
    "mein",
    "mere",
    "aap",
    "ap",
    "hai",
    "hain",
    "kya",
    "kea",
    "kitna",
    "kitne",
    "kitny",
    "aur",
    "bas",
    "bhej",
    "bejh",
    "dein",
    "do",
    "chahiy",
    "karna",
    "karo",
    "krna",
    "dikhao",
    "batao",
    "bataiye",
    "milega",
    "chahiye",
    "ho",
    "gey",
    "gaye"
  ];

  for(const word of romanUrduWords){

    if(
      new RegExp("\\b"+word+"\\b","i").test(q)
    ){
      return "ur";
    }

  }

  return "en";
}

function normalize(value){

  return String(value || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ")
    .trim();

}

/* =========================================================
   QUANTITY
========================================================= */

function extractQuantity(text){

  const value=normalize(text);

  /*
    Explicit quantity forms:
    2x
    x2
    2 pieces
    qty 2
    quantity 2
    2 حبات
  */

  const explicitPatterns=[

    /\b(\d+)\s*(x|times)\b/i,

    /\bx\s*(\d+)\b/i,

    /\b(\d+)\s*(pcs|pieces|piece)\b/i,

    /\bquantity\s*(\d+)\b/i,

    /\bqty\s*(\d+)\b/i,

    /(\d+)\s*(حبة|حبات|عدد)/i

  ];

  for(const pattern of explicitPatterns){

    const match=value.match(pattern);

    if(match){

      const number=
        Number(match[1] || match[2]);

      if(number>0 && number<=50){
        return number;
      }

    }

  }


  /*
    Bare number at the beginning:
    2 chicken burger
    1 chikan burger
  */

  const beginning=value.match(
    /^(\d+)\s+/
  );

  if(beginning){

    const number=Number(beginning[1]);

    if(number>0 && number<=50){
      return number;
    }

  }


  /*
    Bare number at the end:
    chicken burger 2
    chikn burger 2
  */

  const ending=value.match(
    /\s+(\d+)$/
  );

  if(ending){

    const number=Number(ending[1]);

    if(number>0 && number<=50){
      return number;
    }

  }


  /*
    English number words.
  */

  const words={

    one:1,
    two:2,
    three:3,
    four:4,
    five:5,
    six:6,
    seven:7,
    eight:8,
    nine:9,
    ten:10

  };

  for(const word in words){

    if(
      new RegExp(
        "(^|\\s)"+word+"(\\s|$)",
        "i"
      ).test(value)
    ){

      return words[word];

    }

  }


  /*
    Urdu number words.
  */

  const urduWords={

    "ایک":1,
    "دو":2,
    "تین":3,
    "چار":4,
    "پانچ":5,
    "چھ":6,
    "سات":7,
    "آٹھ":8,
    "نو":9,
    "دس":10

  };

  for(const word in urduWords){

    if(value.includes(word)){
      return urduWords[word];
    }

  }


  return 1;

}


/*
  Remove quantity before item matching.
*/

function removeQuantity(text){

  let value=normalize(text);

  value=value
    .replace(/\b\d+\s*(x|times|pcs|pieces|piece)\b/gi," ")
    .replace(/\bx\s*\d+\b/gi," ")
    .replace(/\b(quantity|qty)\s*\d+\b/gi," ")
    .replace(/\d+\s*(حبة|حبات|عدد)/gi," ")
    .replace(/^\d+\s+/," ")
    .replace(/\s+\d+$/," ");

  const numberWords=[
    "one","two","three","four","five",
    "six","seven","eight","nine","ten"
  ];

  for(const word of numberWords){

    value=value.replace(
      new RegExp("(^|\\s)"+word+"(\\s|$)","gi"),
      " "
    );

  }

  const urduNumbers=[
    "ایک","دو","تین","چار","پانچ",
    "چھ","سات","آٹھ","نو","دس"
  ];

  for(const word of urduNumbers){
    value=value.replaceAll(word," ");
  }

  return value
    .replace(/\s+/g," ")
    .trim();

}
